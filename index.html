<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Hk2en — Cantonese → English Live Translator</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --text: #f2f4f8;
    --dim: #8b93a3;
    --accent: #4da3ff;
    --danger: #ff5d5d;
    --ok: #3ddc84;
    --radius: 14px;
    --en-size: 2.2rem;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  /* Flip the whole app 180° — for reading across a table while the
     phone's bottom mic points at the person speaking. */
  body.flipped { transform: rotate(180deg); }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
  }

  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    background: var(--panel);
    border-bottom: 1px solid #232733;
    flex-wrap: wrap;
  }
  header h1 {
    font-size: 1.05rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin-right: auto;
    white-space: nowrap;
  }
  header h1 span { color: var(--accent); }

  button {
    font: inherit;
    border: none;
    border-radius: 999px;
    padding: 9px 16px;
    cursor: pointer;
    font-weight: 600;
    transition: filter .15s, transform .05s;
    -webkit-tap-highlight-color: transparent;
  }
  button:active { transform: scale(0.97); }
  button:hover { filter: brightness(1.12); }

  #micBtn {
    background: var(--accent);
    color: #06121f;
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 150px;
    justify-content: center;
  }
  #micBtn.listening { background: var(--danger); color: #fff; }
  #micBtn .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: currentColor;
  }
  #micBtn.listening .dot { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: .35; transform: scale(1.5); }
  }

  .ghost {
    background: transparent;
    color: var(--dim);
    border: 1px solid #2b3040;
  }
  .ghost:hover { color: var(--text); }
  .ghost.active { color: var(--accent); border-color: var(--accent); }

  #status {
    font-size: 0.8rem;
    color: var(--dim);
    padding: 6px 16px;
    min-height: 1.6em;
  }
  #status.error { color: var(--danger); }
  #status.ok { color: var(--ok); }

  main {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 20px clamp(16px, 6vw, 80px) 20px;
    scroll-behavior: smooth;
  }

  #placeholder {
    color: var(--dim);
    text-align: center;
    margin-top: 8vh;
    line-height: 1.7;
    font-size: 1.05rem;
  }
  #placeholder .big { font-size: 2.6rem; margin-bottom: 12px; }
  #placeholder .hint {
    margin: 18px auto 0;
    max-width: 480px;
    font-size: 0.9rem;
    text-align: left;
    background: var(--panel);
    border: 1px solid #2b3040;
    border-radius: var(--radius);
    padding: 14px 18px;
  }
  #placeholder .hint b { color: var(--text); }
  #phHint:empty { display: none; }
  #placeholder .steps {
    margin-top: 14px;
    font-size: 1.15rem;
    line-height: 2.1;
    text-align: left;
    display: inline-block;
  }
  #placeholder .steps b { color: var(--text); }

  .entry {
    margin-bottom: 26px;
    animation: fadeIn .25s ease-out;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: none; }
  }
  .entry .en {
    font-size: var(--en-size);
    line-height: 1.35;
    font-weight: 500;
  }
  .entry .en.pending { color: var(--dim); font-style: italic; }
  .entry .yue {
    margin-top: 6px;
    font-size: calc(var(--en-size) * 0.45);
    color: var(--dim);
    line-height: 1.5;
  }
  body.hide-yue .entry .yue { display: none; }

  #interim {
    color: var(--accent);
    font-size: 1.15rem;
    line-height: 1.5;
    padding: 8px 0;
  }
  #interim:empty { display: none; }

  /* Keyboard-dictation input bar (default on iOS) */
  #kbTip {
    display: none;
    background: var(--accent);
    color: #06121f;
    font-weight: 600;
    font-size: 1.05rem;
    line-height: 1.6;
    padding: 12px 16px;
    text-align: center;
  }
  body.mode-type #kbTip.show { display: block; }
  #typeBar {
    display: none;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    background: var(--panel);
    border-top: 1px solid #232733;
    gap: 10px;
    align-items: flex-end;
  }
  body.mode-type #typeBar { display: flex; }
  body.mode-type #micBtn { display: none; }
  #dictBox {
    flex: 1;
    font: inherit;
    font-size: 1.15rem;
    line-height: 1.5;
    color: var(--text);
    background: #0c0e12;
    border: 1px solid #2b3040;
    border-radius: var(--radius);
    padding: 12px 14px;
    resize: none;
    height: 4em;
    max-height: 7em;
    outline: none;
  }
  #dictBox:focus { border-color: var(--accent); }
  #dictBox::placeholder { color: var(--dim); }

  #unsupported {
    display: none;
    margin: 8vh auto 0;
    max-width: 560px;
    background: var(--panel);
    border: 1px solid #2b3040;
    border-radius: var(--radius);
    padding: 28px;
    line-height: 1.7;
  }
  #unsupported h2 { margin-bottom: 10px; font-size: 1.2rem; }

  @media (max-width: 600px) {
    :root { --en-size: 1.7rem; }
    header { padding: 10px 10px; gap: 6px; }
    button { padding: 8px 12px; font-size: 0.9rem; }
    #micBtn { min-width: 120px; }
    header h1 { font-size: 0.95rem; }
  }
</style>
</head>
<body>

<header>
  <h1>Hk2<span>en</span> · 廣東話 → English</h1>
  <button id="fontDown" class="ghost" title="Smaller text">A−</button>
  <button id="fontUp" class="ghost" title="Larger text">A+</button>
  <button id="toggleYue" class="ghost active" title="Show/hide original Cantonese">粵</button>
  <button id="flipBtn" class="ghost" title="Flip the screen upside down">🔄</button>
  <button id="clearBtn" class="ghost">Clear</button>
  <button id="modeBtn" class="ghost" title="Switch input mode">⌨️</button>
  <button id="micBtn"><span class="dot"></span><span id="micLabel">Start listening</span></button>
</header>

<div id="status"></div>

<main id="main">
  <div id="placeholder">
    <div class="big">🎙️ 講嘢啦！</div>
    <!-- Static fallback: visible only where JavaScript can't run
         (e.g. iOS file previews). Replaced on load when the app starts. -->
    <div id="phText">⚠️ The app hasn't started — this looks like a file
      preview. Please open this page in <b>Safari</b> instead.</div>
    <div class="hint" id="phHint"></div>
  </div>
  <div id="transcript"></div>
  <div id="interim"></div>
</main>

<div id="kbTip">1️⃣ Hold 🌐 and pick <b>廣東話</b> &nbsp;→&nbsp; 2️⃣ Tap the keyboard's 🎙️ &nbsp;→&nbsp; 3️⃣ Speak!</div>
<div id="typeBar">
  <textarea id="dictBox" rows="2"
    placeholder="👉 㩒呢度開始 · Tap here to start"></textarea>
</div>

<script>
(() => {
  'use strict';

  const $ = id => document.getElementById(id);
  const micBtn = $('micBtn'), micLabel = $('micLabel'), statusEl = $('status');
  const transcriptEl = $('transcript'), interimEl = $('interim');
  const mainEl = $('main'), placeholder = $('placeholder');
  const dictBox = $('dictBox'), modeBtn = $('modeBtn');

  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent)
    || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); // iPadOS
  const isAppleWebKit = isIOS || /^((?!chrome|android).)*safari/i.test(navigator.userAgent);

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  // ---------- Input modes ----------
  // 'mic'  = in-page speech recognition (Chrome/Edge desktop & Android)
  // 'type' = native keyboard dictation into a text box (reliable on iOS,
  //          where in-page speech recognition is flaky)
  let mode = (isIOS || !SR) ? 'type' : 'mic';

  function applyMode() {
    document.body.classList.toggle('mode-type', mode === 'type');
    modeBtn.textContent = mode === 'type' ? '🎤' : '⌨️';
    modeBtn.title = mode === 'type'
      ? 'Switch to in-page microphone' : 'Switch to keyboard dictation';
    modeBtn.style.display = SR ? '' : 'none'; // no mic mode to switch to
    if (mode === 'type') {
      stopListening(true);
      $('phText').innerHTML =
        '<div class="steps">' +
        '1️⃣ <b>Tap the box</b> at the bottom of the screen<br>' +
        '2️⃣ Hold 🌐 on the keyboard, pick <b>廣東話</b><br>' +
        '3️⃣ Tap the keyboard’s <b>🎙️</b> and just talk</div><br>' +
        'English appears here in big letters as you speak.';
      $('phHint').innerHTML =
        '<b>First time on iPhone?</b> Add the Cantonese keyboard: ' +
        'Settings → General → Keyboard → Keyboards → Add New Keyboard → ' +
        '<b>Cantonese, Traditional (廣東話)</b>, and make sure ' +
        '<b>Enable Dictation</b> is on.';
      setStatus('Ready — tap the box below to start. 㩒下面個框開始。');
    } else {
      $('phText').innerHTML =
        '<div class="steps">' +
        '1️⃣ Press <b>Start listening</b> and allow the microphone<br>' +
        '2️⃣ 📍 Put the phone <b>close to whoever is talking</b><br>' +
        '3️⃣ English appears here in big letters as they speak</div>';
      $('phHint').innerHTML = isAppleWebKit
        ? 'Hands-free mode: no keyboard needed — it listens continuously and ' +
          'restarts itself. If it keeps stopping or mishears, switch back to ' +
          'the ⌨️ keyboard mode.'
        : 'Works in <b>Chrome or Edge</b> (desktop / Android). On iPhone or ' +
          'iPad you can also try the ⌨️ keyboard-dictation mode.';
      setStatus('Press “Start listening”, then speak Cantonese.');
    }
  }

  modeBtn.addEventListener('click', () => {
    mode = (mode === 'type') ? 'mic' : 'type';
    applyMode();
  });

  // ---------- Mic mode: in-page speech recognition ----------
  let recognition = null;
  let listening = false;        // user intent: should we be listening?
  let restartTimer = null;

  function buildRecognition() {
    const rec = new SR();
    // Apple's recognizer uses zh-HK for Cantonese; Google's uses yue-Hant-HK.
    rec.lang = isAppleWebKit ? 'zh-HK' : 'yue-Hant-HK';
    // Apple's continuous mode is unreliable; run one phrase per session and
    // rely on the auto-restart in onend to keep listening indefinitely.
    rec.continuous = !isAppleWebKit;
    rec.interimResults = true;

    rec.onresult = (event) => {
      let interim = '';
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const res = event.results[i];
        const text = res[0].transcript.trim();
        if (!text) continue;
        if (res.isFinal) {
          addEntry(text);
        } else {
          interim += text;
        }
      }
      interimEl.textContent = interim;
      scrollToBottom();
    };

    rec.onerror = (event) => {
      if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
        listening = false;
        setStatus('Microphone access was blocked. Allow the mic permission and try again.', 'error');
        updateMicUI();
      } else if (event.error === 'no-speech') {
        // harmless during pauses in long speech; onend will restart
      } else if (event.error === 'network') {
        setStatus('Speech service network error — retrying…', 'error');
      }
    };

    // Browsers stop recognition periodically; auto-restart so long
    // Cantonese speech keeps flowing without the user doing anything.
    rec.onend = () => {
      interimEl.textContent = '';
      if (listening) {
        clearTimeout(restartTimer);
        restartTimer = setTimeout(() => {
          if (!listening) return;
          try { rec.start(); } catch (_) { /* already started */ }
        }, 250);
      } else {
        updateMicUI();
      }
    };

    rec.onstart = () => {
      if (listening) setStatus('Listening… speak Cantonese. 講緊嘢就會即刻翻譯。', 'ok');
    };

    return rec;
  }

  // Keep the screen awake during long conversations — the phone locking
  // is the most common reason a listening session silently dies.
  let wakeLock = null;
  async function keepAwake(on) {
    try {
      if (on && 'wakeLock' in navigator && !wakeLock) {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      } else if (!on && wakeLock) {
        await wakeLock.release();
        wakeLock = null;
      }
    } catch (_) { /* unsupported or denied — harmless */ }
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible'
        && (listening || document.activeElement === dictBox)) keepAwake(true);
  });

  function startListening() {
    if (!SR) return;
    listening = true;
    if (!recognition) recognition = buildRecognition();
    try { recognition.start(); } catch (_) { /* already running */ }
    keepAwake(true);
    updateMicUI();
  }

  function stopListening(silent) {
    const wasListening = listening;
    listening = false;
    clearTimeout(restartTimer);
    if (recognition) { try { recognition.stop(); } catch (_) {} }
    interimEl.textContent = '';
    if (wasListening && !silent) setStatus('Paused. Press “Start listening” to continue.');
    keepAwake(false);
    updateMicUI();
  }

  micBtn.addEventListener('click', () => listening ? stopListening() : startListening());

  function updateMicUI() {
    micBtn.classList.toggle('listening', listening);
    micLabel.textContent = listening ? 'Stop' : 'Start listening';
  }

  // ---------- Type mode: native keyboard dictation ----------
  // iOS keyboard dictation streams text into the box. We never touch the
  // box while the user is dictating (that would break iOS dictation);
  // instead we track how much text is already translated and commit the
  // new remainder whenever typing/dictation pauses briefly.
  let committed = 0;
  let commitTimer = null;

  // Show a one-time "how to dictate" banner when the box is first tapped,
  // and hide it as soon as real text starts arriving.
  const kbTip = $('kbTip');
  dictBox.addEventListener('focus', () => {
    keepAwake(true);
    if (!transcriptEl.children.length && !dictBox.value) kbTip.classList.add('show');
  });
  dictBox.addEventListener('blur', () => keepAwake(listening));

  dictBox.addEventListener('input', () => {
    if (dictBox.value.trim()) kbTip.classList.remove('show');
    if (dictBox.value.length < committed) committed = dictBox.value.length;
    clearTimeout(commitTimer);
    commitTimer = setTimeout(commitDictation, 1000);
  });

  function commitDictation() {
    const text = dictBox.value.slice(committed).trim();
    if (!text) return;
    committed = dictBox.value.length;
    addEntry(text);
    // Keep the box from growing forever once it's safe to trim:
    // only trim when everything so far is committed.
    if (dictBox.value.length > 2000 && committed === dictBox.value.length
        && document.activeElement !== dictBox) {
      dictBox.value = '';
      committed = 0;
    }
  }

  // ---------- Translation (Cantonese → English) ----------
  // Uses Google Translate's public web endpoint — no API key needed.
  // Tries Cantonese ('yue') first, falls back to Chinese if unavailable.
  async function translate(text) {
    const attempt = async (sl) => {
      const url = 'https://translate.googleapis.com/translate_a/single'
        + '?client=gtx&sl=' + sl + '&tl=en&dt=t&q=' + encodeURIComponent(text);
      // Timeout so one stalled request can't block the whole queue.
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 10000);
      const resp = await fetch(url, { signal: controller.signal })
        .finally(() => clearTimeout(timer));
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const data = await resp.json();
      const out = (data[0] || []).map(seg => seg[0]).join('').trim();
      if (!out) throw new Error('empty translation');
      return out;
    };
    try { return await attempt('yue'); }
    catch (_) {
      try { return await attempt('zh-TW'); }
      catch (_) { return null; }
    }
  }

  // Queue translations so entries appear in speaking order even if
  // network responses come back out of order.
  let chain = Promise.resolve();

  function addEntry(yueText) {
    placeholder.style.display = 'none';

    const entry = document.createElement('div');
    entry.className = 'entry';
    const en = document.createElement('div');
    en.className = 'en pending';
    en.textContent = '…';
    const yue = document.createElement('div');
    yue.className = 'yue';
    yue.textContent = yueText;
    entry.append(en, yue);
    transcriptEl.appendChild(entry);
    scrollToBottom();

    chain = chain.then(async () => {
      const result = await translate(yueText);
      if (result) {
        en.textContent = result;
        en.classList.remove('pending');
      } else {
        en.textContent = '[translation failed] ' + yueText;
        en.classList.remove('pending');
        setStatus('Translation request failed — check your internet connection.', 'error');
      }
      scrollToBottom();
    });
  }

  function scrollToBottom() {
    mainEl.scrollTop = mainEl.scrollHeight;
  }

  function setStatus(msg, kind) {
    statusEl.textContent = msg;
    statusEl.className = kind || '';
  }

  // ---------- Controls ----------
  $('clearBtn').addEventListener('click', () => {
    transcriptEl.innerHTML = '';
    interimEl.textContent = '';
    dictBox.value = '';
    committed = 0;
    placeholder.style.display = '';
  });

  $('toggleYue').addEventListener('click', (e) => {
    document.body.classList.toggle('hide-yue');
    e.currentTarget.classList.toggle('active', !document.body.classList.contains('hide-yue'));
  });

  $('flipBtn').addEventListener('click', (e) => {
    document.body.classList.toggle('flipped');
    e.currentTarget.classList.toggle('active', document.body.classList.contains('flipped'));
  });

  let enSize = window.matchMedia('(max-width: 600px)').matches ? 1.7 : 2.2;
  $('fontUp').addEventListener('click', () => setFont(enSize + 0.3));
  $('fontDown').addEventListener('click', () => setFont(enSize - 0.3));
  function setFont(v) {
    enSize = Math.min(5, Math.max(1, v));
    document.documentElement.style.setProperty('--en-size', enSize + 'rem');
  }

  applyMode();
})();
</script>
</body>
</html>
